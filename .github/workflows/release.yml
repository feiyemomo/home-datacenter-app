# CI for home-datacenter-app (Android).
#
# Two jobs, gated by the event:
#   - test:   on push to `main` — run the JVM unit tests. No keystore needed.
#   - release: on tag `v*` or manual (workflow_dispatch) — rebuild the release
#     keystore from GitHub Secrets and build the signed release APK.
#
# REQUIRED SECRETS (configure in GitHub → Settings → Secrets → Actions):
#   RELEASE_KEYSTORE_B64   base64 of app/keystore/home-release.jks
#                          (generate:  certutil -encode ... or openssl base64)
#   RELEASE_KEY_ALIAS      e.g. home-release
#   RELEASE_STORE_PASSWORD store password
#   RELEASE_KEY_PASSWORD   key password
# See SECRETS.md for the exact setup steps.
#
# The keystore is a Git-ignored secret; it is reconstructed only inside the
# ephemeral runner and never persists. If a secret is missing, assembleRelease
# fails loudly (the signing config defaults to empty passwords) rather than
# silently producing an unsigned APK.

name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (JVM)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  release:
    name: Build signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct release keystore from secret
        run: |
          mkdir -p app/keystore
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/keystore/home-release.jks

      - name: Write keystore.properties from secrets
        run: |
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=keystore/home-release.jks
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # NOTE: automatic push of the APK from the runner to the NAS was
      # removed. GitHub-hosted runners live on the public internet and
      # cannot reach the NAS's private LAN IP (192.168.31.235), so SSH
      # uploads always time out. Publish from a machine on the same LAN
      # using push-apk.ps1 instead:
      #
      #   .\push-apk.ps1 -Flavor release -Notes "..."