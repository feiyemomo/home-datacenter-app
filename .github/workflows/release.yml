# CI for home-datacenter-app (Android).
#
# Two jobs, gated by the event:
#   - test:   on push to `main` — run the JVM unit tests. No keystore needed.
#   - release: on tag `v*` or manual (workflow_dispatch) — rebuild the release
#     keystore from GitHub Secrets and build the signed release APK.
#
# REQUIRED SECRETS (configure in GitHub → Settings → Secrets → Actions):
#   RELEASE_KEYSTORE_B64   base64 of app/keystore/home-release.jks
#                          (generate:  certutil -encode ... or openssl base64)
#   RELEASE_KEY_ALIAS      e.g. home-release
#   RELEASE_STORE_PASSWORD store password
#   RELEASE_KEY_PASSWORD   key password
#   NAS_PASSWORD           NAS SSH password (for the "Push APK to NAS" step)
# See SECRETS.md for the exact setup steps.
#
# The keystore is a Git-ignored secret; it is reconstructed only inside the
# ephemeral runner and never persists. If a secret is missing, assembleRelease
# fails loudly (the signing config defaults to empty passwords) rather than
# silently producing an unsigned APK.

name: Build & Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (JVM)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  release:
    name: Build signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct release keystore from secret
        run: |
          mkdir -p app/keystore
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > app/keystore/home-release.jks

      - name: Write keystore.properties from secrets
        run: |
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=keystore/home-release.jks
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Push the signed APK straight to the NAS data/releases directory so
      # the in-app updater (which reads /api/v1/release/latest) picks it up
      # without a manual download+scp. Uses password auth via sshpass —
      # the same credential model as push-apk.ps1 (fnOS rejects pubkey for
      # this user, verified empirically). Requires secret NAS_PASSWORD.
      #
      # The version is parsed from build.gradle.kts so the remote filename
      # stays in sync with the release_handler.go naming convention:
      # "app-release-vX.Y.Z.apk".
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Push APK to NAS
        env:
          NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Pushing app-release-v${VERSION}.apk to NAS"
          sshpass -p "$NAS_PASSWORD" scp -P 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            app/build/outputs/apk/release/app-release.apk \
            "fnos-momo@192.168.31.235:/vol1/docker/home-datacenter/data/releases/app-release-v${VERSION}.apk"
          echo "Pushed OK"